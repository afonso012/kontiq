[project]
name = "faturas-em-dia"
version = "0.1.0"
description = "Recolha, leitura e organização de faturas de compras para gabinetes de contabilidade."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic-settings>=2.2",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
    "pillow>=10.3",
    "pillow-heif>=0.18",
    "pypdfium2>=4.30",
    "zxing-cpp>=2.2",
    "openpyxl>=3.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
producao = ["sentry-sdk[fastapi]>=2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
