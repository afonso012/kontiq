# Serviços locais para desenvolvimento: base de dados e armazenamento de documentos.
# Arrancar:  docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: faturas
      POSTGRES_USER: faturas          # dono das tabelas (usado nas migrações)
      POSTGRES_PASSWORD: faturas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faturas -d faturas"]
      interval: 5s
      retries: 10

  minio:                              # S3 compatível para guardar os PDFs e fotografias
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: faturas
      MINIO_ROOT_PASSWORD: faturas-minio
    ports:
      - "9000:9000"                   # API S3
      - "9001:9001"                   # consola web: http://localhost:9001
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
