# Kontiq em produção: base de dados, aplicação e HTTPS automático (Caddy).
# Num servidor com Docker:
#   cp deploy/.env.exemplo deploy/.env   # e preencher
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# Guia completo: docs/06-producao.md
name: kontiq

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: faturas
      POSTGRES_USER: faturas                     # dono das tabelas (migrações)
      POSTGRES_PASSWORD: ${DB_PASSWORD_DONO:?defina DB_PASSWORD_DONO}
      APP_DB_PASSWORD: ${DB_PASSWORD_APP:?defina DB_PASSWORD_APP}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/01-papel-app.sh:/docker-entrypoint-initdb.d/01-papel-app.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faturas -d faturas"]
      interval: 10s
      retries: 10
    # Sem porta exposta: só a aplicação lhe chega, pela rede interna.

  app:
    build: { context: .., dockerfile: Dockerfile }
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      AMBIENTE: producao
      DATABASE_URL: postgresql+psycopg://faturas_app:${DB_PASSWORD_APP}@db:5432/faturas
      MIGRATIONS_DATABASE_URL: postgresql+psycopg://faturas:${DB_PASSWORD_DONO}@db:5432/faturas
      SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY}
      URL_PUBLICA: https://${DOMINIO}
      PASTA_DOCUMENTOS: /dados/documentos
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_UTILIZADOR: ${SMTP_UTILIZADOR}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_TLS: "true"
      EMAIL_REMETENTE: ${EMAIL_REMETENTE:-Kontiq <nao-responder@kontiq.pt>}
      SMS_MODO: ${SMS_MODO:-simulado}
      PAGAMENTOS_MODO: ${PAGAMENTOS_MODO:-desligado}
      IA_MODO: ${IA_MODO:-teste}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      WORKERS: ${WORKERS:-2}
    volumes:
      - documentos:/dados/documentos

  caddy:                                         # HTTPS com certificado Let's Encrypt automático
    image: caddy:2.8
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443"]
    environment:
      DOMINIO: ${DOMINIO:?defina DOMINIO}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_dados:/data
      - caddy_config:/config

volumes:
  pgdata:
  documentos:
  caddy_dados:
  caddy_config:
